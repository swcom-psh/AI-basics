<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 데이터 받기 · 인공지능 기초</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* 계획서 화면(남색·서식 종이)과 한눈에 구분되도록 청록·크림 톤의 카드형으로 만든다 */
:root{
  --bg:#F4F1E8; --card:#FFFFFF; --ink:#12231F; --ink-2:#3C504A; --muted:#667A73;
  --line:#DDD8C8; --line-2:#ECE8DA;
  --teal:#0B6B5D; --teal-2:#0E8573; --teal-soft:#DDF0EA; --teal-deep:#08433B;
  --amber:#B96A00; --amber-soft:#FFF1D6;
  --bad:#B3361F; --bad-soft:#FCE7E2;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:3px solid #7CCFBE;outline-offset:2px}
.hide{display:none !important}
.num{font-variant-numeric:tabular-nums}

.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;
  font-size:14px;font-weight:600;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--teal)}
.btn.main{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.main:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.big{padding:17px 34px;font-size:19px;font-weight:800;box-shadow:0 8px 20px -10px rgba(11,107,93,.7)}
.btn:disabled{opacity:.5;cursor:default}

/* ════════ 로그인 — 가운데 카드 ════════ */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 15% -10%,#0E8573 0,transparent 60%),
             radial-gradient(900px 500px at 100% 110%,#08433B 0,transparent 60%),#0B6B5D;overflow:auto}
#login .box{width:min(460px,100%);background:var(--card);border-radius:26px;padding:40px 36px 34px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.5);text-align:center}
#login .badge{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;background:var(--teal-soft);color:var(--teal);
  display:flex;align-items:center;justify-content:center}
#login h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.03em}
#login p{margin:0 0 24px;color:var(--ink-2);font-size:16px}
#gbtn{min-height:44px;display:flex;justify-content:center}
#loginmsg{font-size:14.5px;color:var(--bad);min-height:24px;margin-top:14px}
#loginmsg.info{color:var(--ink-2)}
#login .kick{font-size:13px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}

/* ════════ 본 화면 ════════ */
#bar{display:flex;align-items:center;gap:14px;padding:14px max(20px,calc((100% - 760px)/2));
  background:var(--teal-deep);color:#fff}
#bar .brand{white-space:nowrap;font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
#bar .brand svg{opacity:.9}
#bar .sp{flex:1}
#ubar{font-size:14px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.adminchip{font-size:11px;font-weight:800;background:#FFD27A;color:#4A2E00;padding:1px 8px;border-radius:999px;margin-left:8px}
#bar .btn{white-space:nowrap;background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
#bar .btn:hover{background:rgba(255,255,255,.12);border-color:#fff}

#wrap{max-width:760px;margin:0 auto;padding:34px 20px 70px}
.hello{font-size:15px;color:var(--teal);font-weight:700;margin:0 0 4px}
#wrap h2{font-size:34px;font-weight:800;line-height:1.3;margin:0 0 8px;letter-spacing:-.035em;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);margin:0 0 26px}

/* 진행 표시 — 점과 선 */
.track{display:flex;align-items:center;margin:0 0 30px;font-size:13.5px;color:var(--muted);font-weight:600}
.track .dot{display:flex;align-items:center;gap:8px;white-space:nowrap}
.track .dot i{font-style:normal;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.track .bar{flex:1;height:3px;background:var(--line);margin:0 12px;border-radius:2px;min-width:20px}
.track .on{color:var(--ink)} .track .on i{border-color:var(--teal);color:var(--teal)}
.track .done{color:var(--teal)} .track .done i{background:var(--teal);border-color:var(--teal);color:#fff}
.track .bar.done{background:var(--teal)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px;margin-bottom:16px;
  box-shadow:0 14px 30px -24px rgba(18,35,31,.55)}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}

/* 주제 인용 */
.topic{font-size:21px;font-weight:700;line-height:1.5;letter-spacing:-.02em;border-left:5px solid var(--teal);padding:2px 0 2px 16px}
.topic small{display:inline-block;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);
  padding:1px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}

/* 파일 카드 */
.file{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ficon{width:64px;height:78px;border-radius:10px 20px 10px 10px;background:var(--teal-soft);border:2px solid var(--teal);
  position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;color:var(--teal);
  font-weight:800;font-size:15px;letter-spacing:.04em}
.ficon::before{content:"";position:absolute;right:-2px;top:-2px;width:20px;height:20px;background:var(--card);
  border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);border-radius:0 0 0 8px}
.file.off .ficon{background:var(--amber-soft);border-color:#E3B15F;color:var(--amber)}
.file.off .ficon::before{border-color:#E3B15F}
.file.lock .ficon{background:#EFEDE4;border-color:#C9C4B1;color:#8C8670}
.file.lock .ficon::before{border-color:#C9C4B1}
.fname{font-weight:800;font-size:18px;line-height:1.35;word-break:break-all}
.fmeta{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 11px;border-radius:999px;margin-right:6px}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.pill.lock{background:#ECE9DD;color:#6F6A55}
.cta{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:14.5px;background:var(--teal-soft);color:var(--teal-deep)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--amber-soft);color:#6A3F00}

/* 이후 순서 */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px;color:var(--ink-2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--teal);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.steps code{background:var(--teal-soft);color:var(--teal-deep);padding:1px 7px;border-radius:6px;font-size:14px}

#adminbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:2px dashed var(--line);border-radius:16px;
  font-size:14px;color:var(--ink-2);background:transparent}
#adminbox input{padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;width:150px;background:#fff}

.spin{display:inline-block;width:1.1em;height:1.1em;border:2.5px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:560px){
  #wrap h2{font-size:27px}
  .card{padding:20px 18px;border-radius:18px}
  .file{grid-template-columns:1fr;justify-items:start}
  .track .dot span{display:none}
  .topic{font-size:18px}
  #bar .brand span{display:none}
  #bar{gap:8px;padding-left:14px;padding-right:14px}
  #ubar{font-size:13px;padding:4px 10px}
  #login .box{padding:32px 22px 26px}
}
/* ════════ 내 주제 → 데이터 주제 ════════ */
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.swap .side{border-radius:16px;padding:14px 16px;border:1.5px solid var(--line-2);background:#FBFAF4}
.swap .side.new{border-color:var(--teal);background:var(--teal-soft)}
.swap .side small{display:block;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.swap .side.new small{color:var(--teal)}
.swap .side b{font-size:17px;line-height:1.5;font-weight:700;letter-spacing:-.02em}
.swap .arrow{align-self:center;font-size:26px;color:var(--teal);font-weight:800}
.same{font-size:15px;color:var(--teal-deep);background:var(--teal-soft);border-radius:14px;padding:12px 16px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:3px 12px;border-radius:999px;margin:12px 0 0}
.src.real{background:var(--teal-soft);color:var(--teal)}
.src.mix{background:#E4EEF9;color:#1F4E8C}
.src.synth{background:var(--amber-soft);color:var(--amber)}
.srcdesc{font-size:14px;color:var(--muted);margin-top:6px}
.chg{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.chg li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:15.5px;color:var(--ink-2)}
.chg li::before{content:"✎";color:var(--teal);font-weight:800;text-align:center}
.cols{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.col{font-size:13.5px;padding:4px 11px;border-radius:999px;background:#F2EFE3;border:1px solid var(--line-2);color:var(--ink-2);word-break:break-all}
.col.y{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:700}
.col.id{background:transparent;border-style:dashed;color:var(--muted)}
.colkey{font-size:13px;color:var(--muted);margin-top:10px}

/* ════════ 이 데이터로 할까요? ════════ */
.fb{display:grid;gap:12px}
.fb .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb .btn{width:100%;padding:13px 16px;border-radius:16px;font-size:15.5px}
.reason{display:grid;gap:8px;margin:14px 0 10px}
.reason label{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;font-size:15px;line-height:1.5;background:#fff}
.reason label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.reason input{margin-top:5px}
textarea{width:100%;min-height:78px;resize:vertical;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;font-size:15px;color:var(--ink);line-height:1.6}
.hint{font-size:13.5px;color:var(--muted);margin:6px 2px 0}
.stat{display:flex;gap:10px;align-items:flex-start;padding:13px 16px;border-radius:14px;font-size:15px;margin-top:6px}
.stat.wait{background:var(--amber-soft);color:#6A3F00}
.stat.done{background:var(--teal-soft);color:var(--teal-deep)}
.stat b{white-space:nowrap}
.faq{margin-top:4px;font-size:14.5px;color:var(--ink-2)}
.faq summary{cursor:pointer;font-weight:700;padding:6px 0;color:var(--ink)}
.faq p{margin:4px 0 8px}
@media (max-width:560px){
  .swap{grid-template-columns:1fr}
  .swap .arrow{transform:rotate(90deg);justify-self:center}
  .fb .two{grid-template-columns:1fr}
  .stat{flex-direction:column;gap:4px}             /* 좁은 화면에서 제목 옆에 글이 한 단어씩 세로로 쌓이지 않게 */
  .stat b{white-space:normal}
}

/* ════════ 관리자: 학생 화면 미리보기 ════════ */
#app.withlist{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
#app.withlist #bar{grid-column:1/-1;padding-left:20px;padding-right:20px}
#app.withlist #wrap{margin:0 auto;width:100%}
#adminlist{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;background:#EAE6D6;border-right:1px solid var(--line)}
#adminlist .ah{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
#adminlist .ah h4{margin:0 0 2px;font-size:15px;font-weight:800;color:var(--teal-deep)}
#adminlist .ah small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:10px}
#adminlist input[type=search]{width:100%;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;background:#fff;font-size:14.5px}
#adminlist .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#adminlist .chip{font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2)}
#adminlist .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#alist{overflow:auto;flex:1;padding:8px 8px 40px}
#alist .grp{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.05em;padding:12px 10px 4px}
#alist .st{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:14px;padding:8px 10px;margin:1px 0;font-size:14px;line-height:1.4;color:var(--ink)}
#alist .st:hover{background:rgba(255,255,255,.6)}
#alist .st.on{background:#fff;border-color:var(--teal);box-shadow:0 6px 14px -10px rgba(11,107,93,.8)}
#alist .st b{font-weight:800}
#alist .st .no{color:var(--muted);font-size:12.5px;margin-left:6px}
#alist .st .tp{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#alist .dots{display:inline-flex;gap:4px;float:right}
#alist .dots i{font-style:normal;font-size:11px;font-weight:800;padding:0 7px;border-radius:999px;line-height:18px}
#alist .dots .f{background:var(--teal-soft);color:var(--teal)}
#alist .dots .w{background:var(--amber-soft);color:var(--amber)}
#alist .dots .q{background:var(--bad-soft);color:var(--bad)}
#alist .dots .l{background:#ECE9DD;color:#6F6A55}
#alist .none{padding:18px 10px;color:var(--muted);font-size:14px}
.previewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:11px 16px;margin:0 0 22px;border-radius:14px;
  background:#FFF1D6;color:#6A3F00;font-size:14.5px;border:1.5px solid #E3B15F}
.previewbar b{font-weight:800}
.previewbar .sp{flex:1}
@media (max-width:960px){
  #app.withlist{display:block}
  #adminlist{position:static;height:auto;max-height:48vh}
}
</style>
</head>
<body>

<!-- ════════ 로그인 ════════ -->
<div id="login">
  <div class="box">
    <div class="badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></div>
    <h1>내 데이터 받기</h1>
    <p>계획서에서 정한 주제로 만든<br>나만의 CSV 파일을 내려받아요.</p>
    <div id="gbtn"></div>
    <div id="loginmsg"></div>
    <div class="kick">인공지능 기초 · 학교 계정(@sdhs.gwe.hs.kr)으로 로그인</div>
  </div>
</div>

<!-- ════════ 본 화면 ════════ -->
<div id="app" class="hide">
  <header id="bar">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>내 데이터 받기<span style="font-weight:500;opacity:.7;font-size:14px">· 인공지능 기초</span></div>
    <span class="sp"></span>
    <span id="ubar"></span>
    <button class="btn sm" onclick="로그아웃()">로그아웃</button>
  </header>
  <aside id="adminlist" class="hide" aria-label="학생 목록"></aside>
  <main id="wrap"></main>
</div>

<script>

/* ══════════════════════════════════════════════════════
   설정 — index.html 과 같은 값
   ══════════════════════════════════════════════════════ */
const CLIENT_ID = '508397953247-cec1cb0u7jmheuup6llmo05423lcibbu.apps.googleusercontent.com';
const API_URL   = 'https://script.google.com/macros/s/AKfycbwLlLefL8g-DTDgX9ab3qUzIGCU6-zzbI0W9CyME-qsi5yNj3EJIYf-t_ZNOw9kYzAK/exec';
const DOMAIN    = 'sdhs.gwe.hs.kr';
const 계획서주소 = 'https://swcom-psh.github.io/AI-basics/';
/* ══════════════════════════════════════════════════════ */

let 토큰 = '', 나 = null, 상태 = null, 받는중 = false, 받았음 = false, 지정학번 = '';
let 학생목록 = [], 캐시 = {}, 분반필터 = '전체', 검색어 = '', 목록상태 = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);

/* ── 서버 호출 (index.html 과 같은 방식) ── */
async function api(body){
  let r;
  try{
    r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // preflight 를 피하려고 text/plain
      body: JSON.stringify(Object.assign({token: 토큰}, body))
    });
  }catch(e){ return {오류:'서버에 연결하지 못했습니다. 인터넷 상태를 확인하세요.', 재시도가능:true}; }
  let j;
  try{ j = await r.json(); }
  catch(e){ return {오류:'서버가 바빠 응답을 읽지 못했습니다.', 재시도가능:true}; }
  if(j && j.만료){ 만료처리(); return {오류:'로그인이 만료되었습니다. 다시 로그인해 주세요.', 만료:true}; }
  return j;
}
function 토큰지우기(){ 토큰 = ''; try{ sessionStorage.removeItem('idt'); }catch(e){} }
function 로그아웃(){
  if(받는중) return;
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  토큰지우기();
  location.reload();
}
function 만료처리(){
  토큰지우기();
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
  안내('로그인이 만료되었습니다. 다시 로그인해 주세요.', false);
}
function 안내(글, 정보){ const m = $('loginmsg'); m.textContent = 글; m.classList.toggle('info', !!정보); }

/* ── 구글 로그인 ── 계획서 화면(index.html)에서 로그인했다면 같은 탭에서는 그대로 이어진다 */
window.onload = () => {
  let 저장 = ''; try{ 저장 = sessionStorage.getItem('idt') || ''; }catch(e){}
  if(저장){ 안내('이어서 들어가는 중…', true); onCredential({credential: 저장}); }
  const 대기 = setInterval(() => {
    if(!(window.google && google.accounts && google.accounts.id)) return;
    clearInterval(대기);
    google.accounts.id.initialize({
      client_id: CLIENT_ID, callback: onCredential, hd: DOMAIN,
      auto_select: false, cancel_on_tap_outside: false     // 공용 PC — 앞 학생 계정으로 자동 입장하지 않는다
    });
    google.accounts.id.disableAutoSelect();
    google.accounts.id.renderButton($('gbtn'),
      { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'ko', width:320 });
  }, 120);
};
let 로그인중 = false;
async function onCredential(res){
  if(로그인중) return;
  로그인중 = true;
  try{ await 로그인처리(res, 0); } finally{ 로그인중 = false; }
}
async function 로그인처리(res, 시도){
  토큰 = res.credential;
  try{ sessionStorage.setItem('idt', 토큰); }catch(e){}
  안내(시도 ? '로그인 확인이 늦어지고 있어요. 잠시 뒤 다시 시도합니다… ('+시도+'/4)' : '확인하는 중…', true);
  const r = await 상태가져오기('');
  if(r.재시도가능 && 시도 < 4){        // 서버가 몰려 바쁠 뿐이다 — 로그인 정보는 그대로 두고 조금 기다렸다 다시
    await new Promise(ok => setTimeout(ok, 2500 * (시도 + 1) + Math.random() * 2500));
    return 로그인처리(res, 시도 + 1);
  }
  if(r.오류 || !r.ok){
    안내(r.오류 || '로그인에 실패했습니다.', false);
    토큰지우기();
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
    return;
  }
  상태 = r; 나 = r;
  $('login').classList.add('hide');
  안내('', true);
  $('app').classList.remove('hide');
  $('ubar').innerHTML = '<span class="num">' + esc(r.학번 || '') + '</span> ' + esc(r.이름 || '') +
    (r.관리자 ? '<span class="adminchip">관리자</span>' : '');
  그리기();
  if(r.관리자) 관리자목록열기();
}
async function 상태가져오기(학번){
  const r = await api({action:'csvstatus', 학번: 학번 || ''});
  return r;
}

/* ── 화면 ── */
function 흐름(확정, 받음){
  const a = 확정 ? 'done' : 'on', b = 받음 ? 'done' : (확정 ? 'on' : '');
  return '<div class="track">' +
    '<div class="dot '+a+'"><i>'+(확정?'✓':'1')+'</i><span>계획서 확정</span></div><div class="bar '+(확정?'done':'')+'"></div>' +
    '<div class="dot '+b+'"><i>'+(받음?'✓':'2')+'</i><span>데이터 받기</span></div><div class="bar '+(받음?'done':'')+'"></div>' +
    '<div class="dot"><i>3</i><span>수행평가 하기</span></div></div>';
}
function 관리자칸(){
  if(!(나 && 나.관리자)) return '';
  return '<div id="adminbox">목록에 없는 학번 보기 ' +
    '<input id="adno" inputmode="numeric" maxlength="10" placeholder="예) 20262609" onkeydown="if(event.key===\'Enter\')학번보기()">' +
    '<button class="btn sm" onclick="학번보기()">보기</button></div>';
}
function 학번보기(){
  const v = ($('adno').value || '').trim();
  if(!/^\d{4,10}$/.test(v)){ alert('학번은 숫자로 입력하세요.'); return; }
  선택(v);
}

/* ── 관리자: 학생 목록과 미리보기 ──
   로그인한 계정이 관리자일 때만 목록이 나타난다. 계획서를 확정한 학생을 서버(admin 목록)에서 받아 와
   한 명씩 누르면 그 학생이 자기 계정으로 들어갔을 때 보는 화면(csvstatus)을 그대로 보여 준다.
   미리 모두 불러 두기 때문에 누르면 바로 뜬다. 미리보기에서는 학생 기록이 바뀌는 「확인/바꾸고 싶어요」 전송을 막는다. */
async function 관리자목록열기(){
  $('app').classList.add('withlist');
  $('adminlist').classList.remove('hide');
  목록상태 = '불러오는 중…';
  목록틀그리기();
  const r = await api({action:'admin', 일:'목록'});
  if(r.오류){ 목록상태 = r.오류; 목록틀그리기(); return; }
  학생목록 = (r.행 || []).map(x => ({학번:String(x.학번), 이름:x.이름 || '', 학년:x.학년, 반:x.반, 번호:x.번호,
    분반:x.분반 || '', 트랙:x.트랙 || '', 주제:x.주제 || '', 요청:x.변경요청 || null}))
    .sort((a, b) => String(a.학번).localeCompare(String(b.학번)));
  목록상태 = '';
  목록틀그리기();
  미리불러오기();
}
function 목록틀그리기(){
  const A = $('adminlist');
  const 분반있음 = 학생목록.some(x => x.분반);
  const 묶음 = 분반있음 ? ['전체'].concat([...new Set(학생목록.map(x => x.분반 || '미지정'))].sort())
                       : ['전체'].concat([...new Set(학생목록.map(x => x.반 + '반'))].sort((a, b) => parseInt(a) - parseInt(b)));
  A.innerHTML = '<div class="ah"><h4>학생 화면 미리보기</h4><small>' + (학생목록.length ? '계획서를 확정한 학생 ' + 학생목록.length + '명 · 누르면 바로 보여요' : '') + '</small>' +
    '<input type="search" id="asearch" placeholder="이름·학번 찾기" value="' + esc(검색어) + '" oninput="검색바꿈(this.value)">' +
    '<div class="chips">' + 묶음.map(g => '<button class="chip' + (g === 분반필터 ? ' on' : '') + '" onclick="분반바꿈(\'' + g + '\')">' + esc(g) + '</button>').join('') + '</div></div>' +
    '<div id="alist"></div>';
  목록그리기();
}
function 학생의묶음(x){ return 학생목록.some(y => y.분반) ? (x.분반 || '미지정') : x.반 + '반'; }
function 보이는학생(){
  const q = 검색어.trim();
  return 학생목록.filter(x => (분반필터 === '전체' || 학생의묶음(x) === 분반필터) &&
    (!q || x.이름.includes(q) || x.학번.includes(q)));
}
function 목록그리기(){
  const L = $('alist'); if(!L) return;
  if(목록상태){ L.innerHTML = '<div class="none">' + esc(목록상태) + '</div>'; return; }
  const 목록 = 보이는학생();
  if(!목록.length){ L.innerHTML = '<div class="none">찾는 학생이 없어요. 아래 칸에 학번을 직접 써서 볼 수도 있어요.</div>'; return; }
  let 앞 = '', h = '';
  목록.forEach(x => {
    const g = 학생의묶음(x);
    if(g !== 앞){ h += '<div class="grp">' + esc(g) + '</div>'; 앞 = g; }
    const c = 캐시[x.학번];
    let 점 = '';
    if(c){
      if(c.파일) 점 += '<i class="f" title="CSV 있음">CSV</i>'; else 점 += '<i class="w" title="CSV 없음">없음</i>';
      const 변 = c.요청 && c.요청.변경;
      if(변 && 변.상태 === '대기') 점 += '<i class="q" title="바꾸고 싶어요 접수됨">요청</i>';
      else if(c.요청 && c.요청.확인) 점 += '<i class="l" title="학생이 확인함">확인</i>';
    } else 점 += '<i class="l">…</i>';
    h += '<button class="st' + (x.학번 === 지정학번 ? ' on' : '') + '" data-h="' + esc(x.학번) + '" onclick="선택(\'' + esc(x.학번) + '\')">' +
      '<span class="dots">' + 점 + '</span><b>' + esc(x.이름 || x.학번) + '</b><span class="no num">' + esc(x.학번) + '</span>' +
      '<span class="tp">' + esc((x.트랙 ? x.트랙 + ' · ' : '') + x.주제) + '</span></button>';
  });
  const 위 = L.scrollTop;
  L.innerHTML = h;
  L.scrollTop = 위;
}
function 검색바꿈(v){ 검색어 = v; 목록그리기(); }
function 분반바꿈(g){ 분반필터 = g; 목록틀그리기(); }
async function 미리불러오기(){
  const 대기 = 학생목록.map(x => x.학번).filter(h => !캐시[h]);
  let i = 0;
  const 일꾼 = async () => {
    while(i < 대기.length){
      const h = 대기[i++];
      if(캐시[h]) continue;
      const r = await 상태가져오기(h);
      if(r && r.ok){ 캐시[h] = r; if(h === 지정학번 && (!상태 || 상태.__대기)) 선택그리기(h); }
      목록그리기();
    }
  };
  await Promise.all([일꾼(), 일꾼(), 일꾼()]);
}
function 선택그리기(h){ 상태 = 캐시[h]; 받았음 = false; 그리기(); }
async function 선택(h){
  h = String(h);
  지정학번 = h; 받았음 = false;
  목록그리기();
  if(캐시[h]){ 상태 = 캐시[h]; 그리기(); }
  else { 상태 = {__대기:true, 지정:true, 학번:h, 확정:true, 파일:null, 주제:'', 트랙:''}; $('wrap').innerHTML = previewbar만(h) + '<p class="lead"><span class="spin"></span> 불러오는 중…</p>'; }
  const r = await 상태가져오기(h);                   // 캐시를 먼저 보여 주고, 최신 값으로 한 번 더 확인한다
  if(지정학번 !== h) return;
  if(r.오류){ if(!캐시[h]) alert(r.오류); return; }
  const 바뀜 = JSON.stringify(캐시[h]) !== JSON.stringify(r);
  캐시[h] = r;
  if(바뀜 || !상태 || 상태.학번 !== h){ 상태 = r; 그리기(); }
  목록그리기();
}
async function 내화면(){
  지정학번 = ''; 받았음 = false;
  목록그리기();
  const r = await 상태가져오기('');
  if(r.오류){ alert(r.오류); return; }
  상태 = r; 그리기();
}
function 학생찾기(h){ return 학생목록.find(x => x.학번 === String(h)) || null; }
function previewbar만(h){
  const x = 학생찾기(h);
  return '<div class="previewbar"><span>👁 <b>' + esc(x ? x.이름 : h) + '</b> 학생 화면 미리보기</span></div>';
}
function 미리보기띠(s){
  if(!s.지정) return '';
  const x = 학생찾기(s.학번);
  return '<div class="previewbar"><span>👁 <b>' + esc(x ? x.이름 + ' (' + x.학번 + ')' : s.학번) + '</b> 학생이 자기 계정으로 들어가면 보이는 화면이에요. ' +
    '「확인」·「바꾸고 싶어요」는 학생 기록이 바뀌지 않게 막아 두었어요.</span><span class="sp"></span>' +
    '<button class="btn sm" onclick="내화면()">내 계정으로</button></div>';
}
/* ↑ ↓ 키로 옆 학생으로 */
document.addEventListener('keydown', e => {
  if(!(나 && 나.관리자) || !학생목록.length) return;
  if(e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const t = e.target && e.target.tagName;
  if(t === 'TEXTAREA' || (t === 'INPUT' && e.target.id !== 'asearch')) return;
  const L = 보이는학생(); if(!L.length) return;
  let i = L.findIndex(x => x.학번 === 지정학번);
  i = e.key === 'ArrowDown' ? Math.min(L.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);
  e.preventDefault();
  선택(L[i].학번);
  const el = document.querySelector('#alist .st.on'); if(el) el.scrollIntoView({block:'nearest'});
});
function 크기글(n){ return n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB'; }

const 자료설명 = {
  '실제 자료': ['real', '실제로 기록된 자료로 만들었어요.'],
  '실제 날씨·달력 + 규칙으로 만든 값': ['mix', '날씨와 달력은 실제 값이고, 나머지는 현실의 관계를 따라 규칙으로 만든 값이에요.'],
  '실제 달력 + 규칙으로 만든 값': ['mix', '요일·방학 같은 달력은 실제 값이고, 나머지는 현실의 관계를 따라 규칙으로 만든 값이에요.'],
  '공개 연구용 시뮬레이션 자료': ['real', 'NASA 같은 연구 기관이 만들어 공개한 연구용 자료예요. 실제 연구에서도 쓰이는 값이에요.'],
  '규칙으로 만든 가상 자료': ['synth', '실제 자료를 구할 수 없어서, 그 분야에서 알려진 관계를 따라 만든 연습용 자료예요. 현실의 실제 값은 아니에요.']
};
function 열그리기(열){
  if(!열 || !열.length) return '';
  const 칩 = 열.map((c, i) => {
    const 이름 = c.replace(/_/g, ' ');
    if(i === 열.length - 1) return '<span class="col y" title="맞힐 값">'+esc(이름)+'</span>';
    if(i === 0) return '<span class="col id" title="행을 구분하는 열">'+esc(이름)+'</span>';
    return '<span class="col">'+esc(이름)+'</span>';
  }).join('');
  return '<div class="cols">'+칩+'</div><div class="colkey">초록색은 맞힐 값(y), 점선은 행을 구분하는 열이에요. 나머지 5개는 맞히는 데 쓸 수 있는 정보(x 후보)예요. 수행평가에서는 평가지가 안내하는 대로 이 중 1개를 빼고 4개를 골라요.</div>';
}
function 바뀜카드(s){
  const 안 = s.안내;
  if(!안) return '';
  const 자 = 자료설명[안.자료] || ['synth', ''];
  const 같음 = !안.바뀐점.length;
  const 위 = (같음 || String(안.데이터주제).replace(/\s/g,'') === String(s.주제||'').replace(/\s/g,''))
    ? '<div class="same">내가 정한 주제 그대로 데이터를 만들었어요.</div>'
    : '<div class="swap"><div class="side"><small>내가 정한 주제</small><b>'+esc(s.주제||'')+'</b></div><div class="arrow" aria-hidden="true">→</div>' +
      '<div class="side new"><small>데이터로 만든 주제</small><b>'+esc(안.데이터주제)+'</b></div></div>';
  return '<div class="card"><h3>내 주제와 데이터</h3>' + 위 +
    (안.바뀐점.length ? '<ul class="chg">'+안.바뀐점.map(t=>'<li><span>'+esc(t)+'</span></li>').join('')+'</ul>' : '') +
    '<span class="src '+자[0]+'">'+esc(안.자료)+'</span>' + (자[1] ? '<div class="srcdesc">'+esc(자[1])+'</div>' : '') + '</div>';
}
function 응답카드(s){
  const q = s.요청 || {확인:false, 변경:null}, 변경 = q.변경;
  const 바뀐뒤 = q.확인 && q.확인시각 && s.파일 && s.파일.수정 && s.파일.수정 > q.확인시각;   // 「확인」을 누른 뒤에 데이터가 새로 바뀌었다
  let h = '<div class="card" id="fbcard"><h3>이 데이터로 해도 될까요?</h3>';
  if(변경 && 변경.상태 === '대기'){
    h += '<div class="stat wait"><b>바꾸고 싶어요 접수됨</b><span>'+esc(변경.시각)+' · '+esc(변경.이유)+'<br>'+esc(변경.내용)+'<br><span class="hint">선생님이 확인한 뒤 이 화면에 메모를 남겨요. 기다리는 동안 지금 데이터로 수행평가를 계속 연습해도 돼요.</span></span></div>' +
      '<div class="cta"><button class="btn sm" onclick="요청열기()">내용 고치기</button></div>';
  } else if(변경 && 변경.상태 === '처리됨'){
    h += '<div class="stat done"><b>선생님 답</b><span>'+esc(변경.메모 || '확인했어요.')+'<br><span class="hint">'+esc(변경.시각)+' 요청 · '+esc(변경.이유)+'</span></span></div>' +
      '<div class="cta"><button class="btn sm" onclick="요청열기()">다시 요청하기</button></div>';
  } else if(바뀐뒤){
    h += '<div class="stat wait"><b>데이터가 새로 바뀌었어요</b><span>「확인했어요」를 누른 뒤에 선생님이 데이터를 고쳤어요. 위의 「내 주제와 데이터」를 다시 읽고 알려 주세요.</span></div>' +
      '<div class="fb"><div class="two"><button class="btn main" onclick="확인하기()">좋아요, 바뀐 데이터로 할게요</button>' +
      '<button class="btn" onclick="요청열기()">바꾸고 싶어요</button></div></div>';
  } else if(q.확인){
    h += '<div class="stat done"><b>확인했어요</b><span>이 데이터로 하기로 했어요. 마음이 바뀌면 아래에서 언제든 바꾸고 싶다고 알려 주세요.</span></div>' +
      '<div class="cta"><button class="btn sm" onclick="요청열기()">바꾸고 싶어졌어요</button></div>';
  } else {
    h += '<p class="lead" style="font-size:15.5px;margin:0 0 12px">받은 데이터를 훑어보고, 이대로 해도 되는지 알려 주세요. 선생님이 반 전체의 의견을 보고 필요하면 데이터를 고쳐 줘요.</p>' +
      '<div class="fb"><div class="two"><button class="btn main" onclick="확인하기()">좋아요, 이 데이터로 할게요</button>' +
      '<button class="btn" onclick="요청열기()">바꾸고 싶어요</button></div></div>';
  }
  h += '<div id="reqform" class="hide">' +
    '<div class="reason" role="radiogroup" aria-label="바꾸고 싶은 이유">' +
      '<label><input type="radio" name="why" value="정보·맞힐 값만 바꾸고 싶어요"><span><b>주제는 그대로, 정보(x)나 맞힐 값(y)을 조금 바꾸고 싶어요</b><br><span class="hint">예: 이 열 말고 다른 정보를 쓰고 싶어요</span></span></label>' +
      '<label><input type="radio" name="why" value="다른 주제로 하고 싶어요"><span><b>마음에 안 들어요. 다른 주제로 하고 싶어요</b><br><span class="hint">예: 데이터가 내 관심과 너무 달라요 / 너무 어려워요</span></span></label>' +
      '<label><input type="radio" name="why" value="데이터가 이상해요"><span><b>데이터가 이상하거나 파일이 잘 안 열려요</b><br><span class="hint">예: 값이 말이 안 되는 것 같아요 / 열 이름이 이상해요</span></span></label></div>' +
    '<textarea id="reqtxt" maxlength="400" placeholder="어떻게 바꾸고 싶은지, 왜 그런지 한두 문장으로 써 주세요. (5자 이상)">'+esc(변경 ? 변경.내용 : '')+'</textarea>' +
    '<div class="hint">보낸 내용은 선생님만 봐요. 한 번에 하나만 접수돼요(다시 보내면 내용이 바뀌어요).</div>' +
    '<div class="cta"><button class="btn main" id="reqbtn" onclick="요청보내기()">선생님께 보내기</button><button class="btn ghost" onclick="요청닫기()">그만두기</button></div><div id="reqmsg"></div></div>' +
    '<details class="faq"><summary>다른 주제로 완전히 바꾸고 싶다면?</summary><p>먼저 위에서 「다른 주제로 하고 싶어요」를 보내 주세요. 선생님이 확인하고 데이터를 다시 만들거나, 계획서를 다시 쓰도록 열어 줘요. ' +
    '계획서에서 혼자 주제를 바꾸면 이미 만든 데이터와 맞지 않아 수행평가를 할 수 없을 수 있어요.</p></details></div>';
  return h;
}

function 그리기(){
  const s = 상태, 파일 = s.파일, W = $('wrap');
  const 이름 = (!s.지정 && s.이름) || (s.지정 ? ((학생찾기(s.학번) || {}).이름 || s.학번) : '');   // 파일 이름(학번_data.csv)에는 이름이 없다
  const 시험 = s.지정 ? '<div class="note info">미리보기에서 파일을 받으면 다운로드 기록에 남아요(받은 계정은 관리자 계정으로 표시).</div>' : '';
  const 주제카드 = '<div class="card"><h3>내가 정한 주제</h3><div class="topic">'+esc(s.주제||'')+(s.트랙?'<small>'+esc(s.트랙)+'</small>':'')+'</div></div>';
  let h = '';

  if(!s.확정){
    h = '<p class="hello">'+esc(이름 ? 이름+' 님' : '안녕하세요')+'</p><h2>먼저 계획서를 써야 해요</h2>' +
      '<p class="lead">데이터는 계획서에서 정한 주제에 맞춰 만들어집니다.<br>주제를 정하고 「주제 확정하기」까지 누르면 여기서 받을 수 있어요.</p>' +
      흐름(false,false) +
      '<div class="card"><div class="file lock"><div class="ficon">CSV</div><div>' +
        '<span class="pill lock">잠겨 있어요</span><div class="fname" style="margin-top:6px">계획서를 확정하면 열립니다</div>' +
        '<div class="fmeta">내 주제 · 내 데이터 파일</div></div></div>' +
      '<div class="cta"><a class="btn main big" href="'+계획서주소+'">계획서 쓰러 가기 →</a></div>' +
      '<div class="note info">계획서 주소 <a href="'+계획서주소+'">'+계획서주소+'</a><br>확정한 뒤 이 화면을 새로고침하세요.</div></div>';
  } else if(!파일){
    h = '<p class="hello">'+esc(이름)+' 님</p><h2>데이터를 만들고 있어요</h2>' +
      '<p class="lead">계획서는 잘 제출되었어요. 선생님이 주제에 맞는 데이터를 준비 중이라 아직 받을 파일이 없습니다.</p>' +
      흐름(true,false) + 주제카드 +
      '<div class="card"><div class="file off"><div class="ficon">CSV</div><div>' +
        '<span class="pill wait">준비 중</span><div class="fname" style="margin-top:6px">선생님이 만드는 중이에요</div>' +
        '<div class="fmeta">준비되면 여기에 받기 버튼이 나타납니다</div></div></div>' +
      '<div class="cta"><button class="btn main" id="refbtn" onclick="새로고침()">다시 확인하기</button></div></div>';
  } else {
    h = '<p class="hello">'+esc(이름)+' 님</p><h2>'+(받았음?'데이터를 받았어요':'내 데이터가 준비됐어요')+'</h2>' +
      '<p class="lead">'+(받았음?'「다운로드」 폴더에 저장됩니다. 못 찾겠으면 다시 받을 수 있어요.':'내 주제에 맞춘 CSV 파일이에요. 받기 전에 어떻게 만들어졌는지 먼저 읽어 보세요.')+'</p>' +
      흐름(true,받았음) +
      (s.안내 ? 바뀜카드(s) : 주제카드) +
      '<div class="card"><div class="file"><div class="ficon">CSV</div><div>' +
        '<span class="pill ok">받을 수 있어요</span><div class="fname" style="margin-top:6px">'+esc(파일.이름)+'</div>' +
        '<div class="fmeta num">'+(파일.크기?크기글(파일.크기):'')+(s.열 ? ' · 열 '+s.열.length+'개' : '')+'</div></div></div>' +
      (s.열 ? '<div style="margin-top:16px">'+열그리기(s.열)+'</div>' : '') +
      '<div class="cta"><button class="btn main big" id="dlbtn" onclick="받기()">'+(받았음?'↓ 다시 받기':'↓ CSV 파일 받기')+'</button></div>' +
      '<div id="dlmsg"></div></div>' +
      응답카드(s) +
      '<div class="card"><h3>받은 다음에는</h3><ol class="steps">' +
        '<li><span>파일을 구글 코랩(또는 쓰는 파이썬 환경)에 올려요.</span></li>' +
        '<li><span><code>pd.read_csv("'+esc(파일.이름)+'")</code> 로 읽어요. 파일 이름은 바꾸지 마세요.</span></li>' +
        '<li><span>수행평가지 순서(결측치 → 이상치 → 상관 → 모델)대로 진행해요.</span></li></ol></div>';
  }
  W.innerHTML = 미리보기띠(s) + h + 시험 + 관리자칸();
}

/* ── 이 데이터로 할까요? ── */
function 요청열기(){ const f = $('reqform'); if(f){ f.classList.remove('hide'); f.scrollIntoView({behavior:'smooth', block:'center'}); } }
function 요청닫기(){ const f = $('reqform'); if(f) f.classList.add('hide'); }
async function 확인하기(){
  if(지정학번){ alert('미리보기에서는 학생 기록이 바뀌지 않게 보낼 수 없어요.'); return; }
  const r = await api({action:'csvreq', 종류:'확인', 학번:지정학번});
  if(r.오류){ alert(r.오류); return; }
  상태.요청 = r.요청; 그리기();
}
async function 요청보내기(){
  if(지정학번){ alert('미리보기에서는 학생 기록이 바뀌지 않게 보낼 수 없어요.'); return; }
  const 이유 = (document.querySelector('input[name="why"]:checked') || {}).value || '';
  const 내용 = ($('reqtxt').value || '').trim();
  const m = $('reqmsg');
  if(!이유){ m.innerHTML = '<div class="note bad">바꾸고 싶은 이유를 하나 골라 주세요.</div>'; return; }
  if(내용.length < 5){ m.innerHTML = '<div class="note bad">어떻게 바꾸고 싶은지 한 줄(5자 이상) 써 주세요.</div>'; return; }
  const b = $('reqbtn'); b.disabled = true; b.innerHTML = '<span class="spin"></span> 보내는 중';
  const r = await api({action:'csvreq', 종류:'바꾸고싶어요', 이유:이유, 내용:내용, 학번:지정학번});
  if(r.오류 || !r.ok){ b.disabled = false; b.textContent = '선생님께 보내기'; m.innerHTML = '<div class="note bad">'+esc(r.오류 || '보내지 못했어요. 잠시 뒤 다시 눌러 주세요.')+'</div>'; return; }
  상태.요청 = r.요청; 그리기();
}
async function 새로고침(){
  const b = $('refbtn');
  if(b){ b.disabled = true; b.innerHTML = '<span class="spin"></span> 확인하는 중'; }
  const r = await 상태가져오기(지정학번);
  if(r.오류) alert(r.오류); else 상태 = r;
  그리기();
}

/* ── 받기 ── */
async function 받기(){
  if(받는중) return;
  받는중 = true;
  const b = $('dlbtn');
  b.disabled = true; b.innerHTML = '<span class="spin"></span> 준비하는 중…'; $('dlmsg').innerHTML = '';
  const r = await api({action:'csvget', 학번: 지정학번});
  받는중 = false;
  if(r.오류 || !r.ok){
    그리기();
    $('dlmsg').innerHTML = '<div class="note bad">'+esc(r.오류 || '받지 못했습니다. 잠시 뒤 다시 눌러 주세요.')+'</div>';
    return;
  }
  const blob = new Blob([r.내용], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = r.파일명;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  받았음 = true;
  그리기();
  $('dlmsg').innerHTML = '<div class="note">「'+esc(r.파일명)+'」 파일을 내려받았습니다.</div>';
}
</script>
