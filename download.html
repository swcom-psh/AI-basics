<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 데이터 받기 · 인공지능 기초</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* 계획서 화면(남색·서식 종이)과 한눈에 구분되도록 청록·크림 톤의 카드형으로 만든다 */
:root{
  --bg:#F4F1E8; --card:#FFFFFF; --ink:#12231F; --ink-2:#3C504A; --muted:#667A73;
  --line:#DDD8C8; --line-2:#ECE8DA;
  --teal:#0B6B5D; --teal-2:#0E8573; --teal-soft:#DDF0EA; --teal-deep:#08433B;
  --amber:#B96A00; --amber-soft:#FFF1D6;
  --bad:#B3361F; --bad-soft:#FCE7E2;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:3px solid #7CCFBE;outline-offset:2px}
.hide{display:none !important}
.num{font-variant-numeric:tabular-nums}

.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;
  font-size:14px;font-weight:600;line-height:1.3;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--teal)}
.btn.main{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.main:hover{background:var(--teal-2);border-color:var(--teal-2)}
.btn.sm{padding:6px 13px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.big{padding:17px 34px;font-size:19px;font-weight:800;box-shadow:0 8px 20px -10px rgba(11,107,93,.7)}
.btn:disabled{opacity:.5;cursor:default}

/* ════════ 로그인 — 가운데 카드 ════════ */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1200px 600px at 15% -10%,#0E8573 0,transparent 60%),
             radial-gradient(900px 500px at 100% 110%,#08433B 0,transparent 60%),#0B6B5D;overflow:auto}
#login .box{width:min(460px,100%);background:var(--card);border-radius:26px;padding:40px 36px 34px;
  box-shadow:0 30px 60px -30px rgba(0,0,0,.5);text-align:center}
#login .badge{width:68px;height:68px;margin:0 auto 18px;border-radius:20px;background:var(--teal-soft);color:var(--teal);
  display:flex;align-items:center;justify-content:center}
#login h1{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.03em}
#login p{margin:0 0 24px;color:var(--ink-2);font-size:16px}
#gbtn{min-height:44px;display:flex;justify-content:center}
#loginmsg{font-size:14.5px;color:var(--bad);min-height:24px;margin-top:14px}
#loginmsg.info{color:var(--ink-2)}
#login .kick{font-size:13px;color:var(--muted);margin-top:22px;padding-top:16px;border-top:1px dashed var(--line)}

/* ════════ 본 화면 ════════ */
#bar{display:flex;align-items:center;gap:14px;padding:14px max(20px,calc((100% - 760px)/2));
  background:var(--teal-deep);color:#fff}
#bar .brand{white-space:nowrap;font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
#bar .brand svg{opacity:.9}
#bar .sp{flex:1}
#ubar{font-size:14px;padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.adminchip{font-size:11px;font-weight:800;background:#FFD27A;color:#4A2E00;padding:1px 8px;border-radius:999px;margin-left:8px}
#bar .btn{white-space:nowrap;background:transparent;border-color:rgba(255,255,255,.4);color:#fff}
#bar .btn:hover{background:rgba(255,255,255,.12);border-color:#fff}

#wrap{max-width:760px;margin:0 auto;padding:34px 20px 70px}
.hello{font-size:15px;color:var(--teal);font-weight:700;margin:0 0 4px}
#wrap h2{font-size:34px;font-weight:800;line-height:1.3;margin:0 0 8px;letter-spacing:-.035em;text-wrap:balance}
.lead{font-size:17px;color:var(--ink-2);margin:0 0 26px}

/* 진행 표시 — 점과 선 */
.track{display:flex;align-items:center;margin:0 0 30px;font-size:13.5px;color:var(--muted);font-weight:600}
.track .dot{display:flex;align-items:center;gap:8px;white-space:nowrap}
.track .dot i{font-style:normal;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.track .bar{flex:1;height:3px;background:var(--line);margin:0 12px;border-radius:2px;min-width:20px}
.track .on{color:var(--ink)} .track .on i{border-color:var(--teal);color:var(--teal)}
.track .done{color:var(--teal)} .track .done i{background:var(--teal);border-color:var(--teal);color:#fff}
.track .bar.done{background:var(--teal)}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 28px;margin-bottom:16px;
  box-shadow:0 14px 30px -24px rgba(18,35,31,.55)}
.card h3{margin:0 0 10px;font-size:13.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}

/* 주제 인용 */
.topic{font-size:21px;font-weight:700;line-height:1.5;letter-spacing:-.02em;border-left:5px solid var(--teal);padding:2px 0 2px 16px}
.topic small{display:inline-block;font-size:13px;font-weight:700;color:var(--teal);background:var(--teal-soft);
  padding:1px 10px;border-radius:999px;margin-left:8px;vertical-align:3px}

/* 파일 카드 */
.file{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ficon{width:64px;height:78px;border-radius:10px 20px 10px 10px;background:var(--teal-soft);border:2px solid var(--teal);
  position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;color:var(--teal);
  font-weight:800;font-size:15px;letter-spacing:.04em}
.ficon::before{content:"";position:absolute;right:-2px;top:-2px;width:20px;height:20px;background:var(--card);
  border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);border-radius:0 0 0 8px}
.file.off .ficon{background:var(--amber-soft);border-color:#E3B15F;color:var(--amber)}
.file.off .ficon::before{border-color:#E3B15F}
.file.lock .ficon{background:#EFEDE4;border-color:#C9C4B1;color:#8C8670}
.file.lock .ficon::before{border-color:#C9C4B1}
.fname{font-weight:800;font-size:18px;line-height:1.35;word-break:break-all}
.fmeta{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:12.5px;font-weight:800;padding:2px 11px;border-radius:999px;margin-right:6px}
.pill.ok{background:var(--teal-soft);color:var(--teal)}
.pill.wait{background:var(--amber-soft);color:var(--amber)}
.pill.lock{background:#ECE9DD;color:#6F6A55}
.cta{margin-top:22px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{margin-top:14px;padding:12px 16px;border-radius:14px;font-size:14.5px;background:var(--teal-soft);color:var(--teal-deep)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.info{background:var(--amber-soft);color:#6A3F00}

/* 이후 순서 */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;font-size:15.5px;color:var(--ink-2)}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--teal);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:14px}
.steps code{background:var(--teal-soft);color:var(--teal-deep);padding:1px 7px;border-radius:6px;font-size:14px}

#adminbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border:2px dashed var(--line);border-radius:16px;
  font-size:14px;color:var(--ink-2);background:transparent}
#adminbox input{padding:8px 12px;border:1.5px solid var(--line);border-radius:999px;width:150px;background:#fff}

.spin{display:inline-block;width:1.1em;height:1.1em;border:2.5px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:560px){
  #wrap h2{font-size:27px}
  .card{padding:20px 18px;border-radius:18px}
  .file{grid-template-columns:1fr;justify-items:start}
  .track .dot span{display:none}
  .topic{font-size:18px}
  #bar .brand span{display:none}
  #bar{gap:8px;padding-left:14px;padding-right:14px}
  #ubar{font-size:13px;padding:4px 10px}
  #login .box{padding:32px 22px 26px}
}
</style>
</head>
<body>

<!-- ════════ 로그인 ════════ -->
<div id="login">
  <div class="box">
    <div class="badge"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg></div>
    <h1>내 데이터 받기</h1>
    <p>계획서에서 정한 주제로 만든<br>나만의 CSV 파일을 내려받아요.</p>
    <div id="gbtn"></div>
    <div id="loginmsg"></div>
    <div class="kick">인공지능 기초 · 학교 계정(@sdhs.gwe.hs.kr)으로 로그인</div>
  </div>
</div>

<!-- ════════ 본 화면 ════════ -->
<div id="app" class="hide">
  <header id="bar">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>내 데이터 받기<span style="font-weight:500;opacity:.7;font-size:14px">· 인공지능 기초</span></div>
    <span class="sp"></span>
    <span id="ubar"></span>
    <button class="btn sm" onclick="로그아웃()">로그아웃</button>
  </header>
  <main id="wrap"></main>
</div>

<script>

/* ══════════════════════════════════════════════════════
   설정 — index.html 과 같은 값
   ══════════════════════════════════════════════════════ */
const CLIENT_ID = '508397953247-cec1cb0u7jmheuup6llmo05423lcibbu.apps.googleusercontent.com';
const API_URL   = 'https://script.google.com/macros/s/AKfycbwLlLefL8g-DTDgX9ab3qUzIGCU6-zzbI0W9CyME-qsi5yNj3EJIYf-t_ZNOw9kYzAK/exec';
const DOMAIN    = 'sdhs.gwe.hs.kr';
const 계획서주소 = 'https://swcom-psh.github.io/AI-basics/';
/* ══════════════════════════════════════════════════════ */

let 토큰 = '', 나 = null, 상태 = null, 받는중 = false, 받았음 = false, 지정학번 = '';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);

/* ── 서버 호출 (index.html 과 같은 방식) ── */
async function api(body){
  let r;
  try{
    r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // preflight 를 피하려고 text/plain
      body: JSON.stringify(Object.assign({token: 토큰}, body))
    });
  }catch(e){ return {오류:'서버에 연결하지 못했습니다. 인터넷 상태를 확인하세요.', 재시도가능:true}; }
  let j;
  try{ j = await r.json(); }
  catch(e){ return {오류:'서버가 바빠 응답을 읽지 못했습니다.', 재시도가능:true}; }
  if(j && j.만료){ 만료처리(); return {오류:'로그인이 만료되었습니다. 다시 로그인해 주세요.', 만료:true}; }
  return j;
}
function 토큰지우기(){ 토큰 = ''; try{ sessionStorage.removeItem('idt'); }catch(e){} }
function 로그아웃(){
  if(받는중) return;
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  토큰지우기();
  location.reload();
}
function 만료처리(){
  토큰지우기();
  $('app').classList.add('hide');
  $('login').classList.remove('hide');
  안내('로그인이 만료되었습니다. 다시 로그인해 주세요.', false);
}
function 안내(글, 정보){ const m = $('loginmsg'); m.textContent = 글; m.classList.toggle('info', !!정보); }

/* ── 구글 로그인 ── 계획서 화면(index.html)에서 로그인했다면 같은 탭에서는 그대로 이어진다 */
window.onload = () => {
  let 저장 = ''; try{ 저장 = sessionStorage.getItem('idt') || ''; }catch(e){}
  if(저장){ 안내('이어서 들어가는 중…', true); onCredential({credential: 저장}); }
  const 대기 = setInterval(() => {
    if(!(window.google && google.accounts && google.accounts.id)) return;
    clearInterval(대기);
    google.accounts.id.initialize({
      client_id: CLIENT_ID, callback: onCredential, hd: DOMAIN,
      auto_select: false, cancel_on_tap_outside: false     // 공용 PC — 앞 학생 계정으로 자동 입장하지 않는다
    });
    google.accounts.id.disableAutoSelect();
    google.accounts.id.renderButton($('gbtn'),
      { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'ko', width:320 });
  }, 120);
};
let 로그인중 = false;
async function onCredential(res){
  if(로그인중) return;
  로그인중 = true;
  try{ await 로그인처리(res, 0); } finally{ 로그인중 = false; }
}
async function 로그인처리(res, 시도){
  토큰 = res.credential;
  try{ sessionStorage.setItem('idt', 토큰); }catch(e){}
  안내(시도 ? '로그인 확인이 늦어지고 있어요. 잠시 뒤 다시 시도합니다… ('+시도+'/4)' : '확인하는 중…', true);
  const r = await 상태가져오기('');
  if(r.재시도가능 && 시도 < 4){        // 서버가 몰려 바쁠 뿐이다 — 로그인 정보는 그대로 두고 조금 기다렸다 다시
    await new Promise(ok => setTimeout(ok, 2500 * (시도 + 1) + Math.random() * 2500));
    return 로그인처리(res, 시도 + 1);
  }
  if(r.오류 || !r.ok){
    안내(r.오류 || '로그인에 실패했습니다.', false);
    토큰지우기();
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
    return;
  }
  상태 = r; 나 = r;
  $('login').classList.add('hide');
  안내('', true);
  $('app').classList.remove('hide');
  $('ubar').innerHTML = '<span class="num">' + esc(r.학번 || '') + '</span> ' + esc(r.이름 || '') +
    (r.관리자 ? '<span class="adminchip">관리자</span>' : '');
  그리기();
}
async function 상태가져오기(학번){
  const r = await api({action:'csvstatus', 학번: 학번 || ''});
  return r;
}

/* ── 화면 ── */
function 흐름(확정, 받음){
  const a = 확정 ? 'done' : 'on', b = 받음 ? 'done' : (확정 ? 'on' : '');
  return '<div class="track">' +
    '<div class="dot '+a+'"><i>'+(확정?'✓':'1')+'</i><span>계획서 확정</span></div><div class="bar '+(확정?'done':'')+'"></div>' +
    '<div class="dot '+b+'"><i>'+(받음?'✓':'2')+'</i><span>데이터 받기</span></div><div class="bar '+(받음?'done':'')+'"></div>' +
    '<div class="dot"><i>3</i><span>수행평가 하기</span></div></div>';
}
function 관리자칸(){
  if(!(나 && 나.관리자)) return '';
  return '<div id="adminbox">관리자 시험 — 학번으로 보기 ' +
    '<input id="adno" inputmode="numeric" maxlength="10" placeholder="예) 20262609" value="'+esc(지정학번)+'" onkeydown="if(event.key===\'Enter\')학번보기()">' +
    '<button class="btn sm" onclick="학번보기()">보기</button>' +
    (지정학번 ? '<button class="btn sm ghost" onclick="학번보기(true)">내 계정으로</button>' : '') + '</div>';
}
async function 학번보기(내것){
  const v = 내것 ? '' : ($('adno').value || '').trim();
  지정학번 = v; 받았음 = false;
  const r = await 상태가져오기(v);
  if(r.오류){ alert(r.오류); return; }
  상태 = r; 그리기();
}
function 크기글(n){ return n < 1024 ? n+' B' : n < 1048576 ? (n/1024).toFixed(0)+' KB' : (n/1048576).toFixed(1)+' MB'; }

function 그리기(){
  const s = 상태, 파일 = s.파일, W = $('wrap');
  const 이름 = (!s.지정 && s.이름) || (파일 ? 파일.이름.replace(/^\d+_/,'').replace(/\.csv$/i,'') : '');
  const 시험 = s.지정 ? '<div class="note info">지금 '+esc(s.학번)+' 학생의 화면을 시험으로 보고 있습니다. 받으면 다운로드 기록에 남습니다.</div>' : '';
  const 주제카드 = '<div class="card"><h3>내가 정한 주제</h3><div class="topic">'+esc(s.주제||'')+(s.트랙?'<small>'+esc(s.트랙)+'</small>':'')+'</div></div>';
  let h = '';

  if(!s.확정){
    h = '<p class="hello">'+esc(이름 ? 이름+' 님' : '안녕하세요')+'</p><h2>먼저 계획서를 써야 해요</h2>' +
      '<p class="lead">데이터는 계획서에서 정한 주제에 맞춰 만들어집니다.<br>주제를 정하고 「주제 확정하기」까지 누르면 여기서 받을 수 있어요.</p>' +
      흐름(false,false) +
      '<div class="card"><div class="file lock"><div class="ficon">CSV</div><div>' +
        '<span class="pill lock">잠겨 있어요</span><div class="fname" style="margin-top:6px">계획서를 확정하면 열립니다</div>' +
        '<div class="fmeta">내 주제 · 내 데이터 파일</div></div></div>' +
      '<div class="cta"><a class="btn main big" href="'+계획서주소+'">계획서 쓰러 가기 →</a></div>' +
      '<div class="note info">계획서 주소 <a href="'+계획서주소+'">'+계획서주소+'</a><br>확정한 뒤 이 화면을 새로고침하세요.</div></div>';
  } else if(!파일){
    h = '<p class="hello">'+esc(이름)+' 님</p><h2>데이터를 만들고 있어요</h2>' +
      '<p class="lead">계획서는 잘 제출되었어요. 선생님이 주제에 맞는 데이터를 준비 중이라 아직 받을 파일이 없습니다.</p>' +
      흐름(true,false) + 주제카드 +
      '<div class="card"><div class="file off"><div class="ficon">CSV</div><div>' +
        '<span class="pill wait">준비 중</span><div class="fname" style="margin-top:6px">선생님이 만드는 중이에요</div>' +
        '<div class="fmeta">준비되면 여기에 받기 버튼이 나타납니다</div></div></div>' +
      '<div class="cta"><button class="btn main" id="refbtn" onclick="새로고침()">다시 확인하기</button></div></div>';
  } else {
    h = '<p class="hello">'+esc(이름)+' 님</p><h2>'+(받았음?'데이터를 받았어요':'내 데이터가 준비됐어요')+'</h2>' +
      '<p class="lead">'+(받았음?'「다운로드」 폴더에 저장됩니다. 못 찾겠으면 다시 받을 수 있어요.':'계획서에서 정한 주제에 맞춘 CSV 파일이에요.')+'</p>' +
      흐름(true,받았음) + 주제카드 +
      '<div class="card"><div class="file"><div class="ficon">CSV</div><div>' +
        '<span class="pill ok">받을 수 있어요</span><div class="fname" style="margin-top:6px">'+esc(파일.이름)+'</div>' +
        '<div class="fmeta num">'+(파일.크기?크기글(파일.크기):'')+'</div></div></div>' +
      '<div class="cta"><button class="btn main big" id="dlbtn" onclick="받기()">'+(받았음?'↓ 다시 받기':'↓ CSV 파일 받기')+'</button></div>' +
      '<div id="dlmsg"></div></div>' +
      '<div class="card"><h3>받은 다음에는</h3><ol class="steps">' +
        '<li><span>파일을 구글 코랩(또는 쓰는 파이썬 환경)에 올려요.</span></li>' +
        '<li><span><code>pd.read_csv("'+esc(파일.이름)+'")</code> 로 읽어요. 파일 이름은 바꾸지 마세요.</span></li>' +
        '<li><span>수행평가지 순서(결측치 → 이상치 → 상관 → 모델)대로 진행해요.</span></li></ol></div>';
  }
  W.innerHTML = h + 시험 + 관리자칸();
}
async function 새로고침(){
  const b = $('refbtn');
  if(b){ b.disabled = true; b.innerHTML = '<span class="spin"></span> 확인하는 중'; }
  const r = await 상태가져오기(지정학번);
  if(r.오류) alert(r.오류); else 상태 = r;
  그리기();
}

/* ── 받기 ── */
async function 받기(){
  if(받는중) return;
  받는중 = true;
  const b = $('dlbtn');
  b.disabled = true; b.innerHTML = '<span class="spin"></span> 준비하는 중…'; $('dlmsg').innerHTML = '';
  const r = await api({action:'csvget', 학번: 지정학번});
  받는중 = false;
  if(r.오류 || !r.ok){
    그리기();
    $('dlmsg').innerHTML = '<div class="note bad">'+esc(r.오류 || '받지 못했습니다. 잠시 뒤 다시 눌러 주세요.')+'</div>';
    return;
  }
  const blob = new Blob([r.내용], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = r.파일명;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  받았음 = true;
  그리기();
  $('dlmsg').innerHTML = '<div class="note">「'+esc(r.파일명)+'」 파일을 내려받았습니다.</div>';
}
</script>
