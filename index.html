<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수행평가 주제 정하기 · 인공지능 기초</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#fff; --panel:#f5f6f7; --line:#dcdfe3; --line2:#eaecef;
  --text:#1c1f23; --muted:#6a7079; --accent:#1f5fa9; --accent-soft:#eaf1fa;
  --bad:#b3261e; --ok:#2b6b41; --warn:#8a5406;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15px;line-height:1.65;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;font-size:15px;color:var(--text)}
.hide{display:none !important}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);
  padding:8px 14px;border-radius:5px;font-size:14px}
.btn:hover{background:#f2f3f5}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#18497f}
.btn:disabled{opacity:.4;cursor:default}
.btn.big{width:100%;padding:11px;font-size:15px;font-weight:600}
.btn.sm{padding:4px 9px;font-size:12.5px}

/* ── 로그인 ── */
#login{position:fixed;inset:0;background:#fff;z-index:60;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
#login h1{font-size:26px;margin:0 0 6px;letter-spacing:-.6px}
#login .sub{color:var(--muted);margin-bottom:30px;text-align:center}
#gbtn{min-height:44px}
#loginmsg{margin-top:16px;font-size:13.5px;color:var(--bad);text-align:center;max-width:420px}
.domain{margin-top:22px;font-size:12.5px;color:var(--muted);text-align:center}

/* ── 반 정보 ── */
#who{position:fixed;inset:0;background:#fff;z-index:55;display:flex;
  flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,94vw);border:1px solid var(--line);border-radius:8px;padding:22px}
.me{background:var(--accent-soft);border-radius:6px;padding:10px 13px;margin-bottom:16px;font-size:14px}
.me b{font-size:15px}
.me .m{color:var(--muted);font-size:12.5px}
.rowf{display:flex;gap:8px;margin-bottom:10px}
.rowf input{flex:1;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:5px}
#whoErr{color:var(--bad);font-size:13.5px;min-height:20px;margin-top:8px}
.prev{margin-top:14px;padding:10px 12px;border:1px solid #f0dcb4;background:#fdf8ee;
  border-radius:6px;font-size:13px;color:#7a4b06}

/* ── 본 화면 ── */
#app{display:flex;height:100vh}
#left{flex:1;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--line)}
#right{width:380px;flex:none;background:var(--panel);overflow-y:auto;padding:16px 16px 40px}
#bar{height:48px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 18px}
#bar b{letter-spacing:-.3px}
#bar .u{color:var(--muted);font-size:13px}
#bar .sp{flex:1}
.adminchip{font-size:11px;font-weight:700;background:#2b6b41;color:#fff;padding:2px 7px;border-radius:3px}
#steps{display:flex;gap:4px;align-items:center;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
#steps span{padding:2px 7px;border-radius:10px;background:#eef0f3;white-space:nowrap}
#steps span.on{background:var(--accent);color:#fff;font-weight:700}
#steps span.done{background:#dbe7d9;color:#2b6b41}

#log{flex:1;overflow-y:auto;padding:22px 0 10px}
.msg{max-width:1200px;margin:0 0 16px;display:flex;gap:11px;padding:0 28px}
.msg .av{width:29px;height:29px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:12.5px;font-weight:700;margin-top:2px}
.msg.bot .av{background:var(--accent-soft);color:var(--accent)}
.msg.me .av{background:#e6e8eb;color:#4c545e}
.msg .body{flex:1;min-width:0;white-space:pre-wrap;word-break:break-word;padding-top:2px}
.typing{color:var(--muted);font-style:italic}
.sysmsg{max-width:1160px;margin:0 28px 14px;padding:10px 14px;border-radius:6px;
  font-size:13.5px;background:#fdf3e0;color:#7a4b06;border:1px solid #f0dcb4}
.sysmsg.bad{background:#fdece9;color:#8e211b;border-color:#f3cdc8}
.sysmsg ul{margin:6px 0 0;padding-left:20px}

#inputbar{flex:none;border-top:1px solid var(--line);padding:12px 18px 16px}
#inputwrap{max-width:1200px;margin:0;display:flex;gap:9px;align-items:flex-end}
#q{flex:1;resize:none;border:1px solid var(--line);border-radius:7px;padding:10px 12px;
  max-height:140px;line-height:1.5}
#q:focus{outline:0;border-color:var(--accent)}
.hint{max-width:1200px;margin:7px 0 0;font-size:12px;color:var(--muted)}

/* ── 정리 패널 ── */
#right h3{margin:0 0 4px;font-size:14px}
#right .note{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.sec{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}
.sec h4{margin:0;padding:8px 11px;font-size:12.5px;background:#f7f8f9;color:#4c545e;
  border-bottom:1px solid var(--line2);border-radius:6px 6px 0 0;font-weight:700}
.sec .in{padding:9px 11px}
.kv{display:flex;gap:8px;font-size:13px;padding:2px 0}
.kv .k{color:var(--muted);flex:none;min-width:62px}
.kv .v{flex:1;word-break:break-word}
.kv .v.no{color:#b9bec4}
.feat{border-top:1px dashed var(--line2);padding:7px 0 3px}
.feat:first-child{border-top:0;padding-top:0}
.feat .nm{font-weight:600;font-size:13.5px}
.feat .dt{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:3px;margin-top:3px;
  background:#eef1f5;color:#4c545e;font-weight:600}
.tag.up{background:#eaf1fa;color:#1f5fa9}
.tag.down{background:#fdece9;color:#b3261e}
#finmsg{font-size:12.5px;color:var(--muted);margin-top:8px;text-align:center}

/* ── 완료 ── */
#done{position:fixed;inset:0;background:#fff;z-index:58;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center}
#done h2{font-size:23px;margin:0 0 10px}
#done p{color:var(--muted);max-width:540px;white-space:pre-wrap}

/* ── 관리자 ── */
#admin{position:fixed;inset:0;background:#fff;z-index:62;overflow:auto;padding:0 0 60px}
#adtop{height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 18px;position:sticky;top:0;background:#fff}
#adtop .sp{flex:1}
table.ad{width:100%;border-collapse:collapse;font-size:13px}
table.ad th,table.ad td{border-bottom:1px solid var(--line2);padding:7px 10px;text-align:left;
  vertical-align:top}
table.ad th{background:#f5f6f7;position:sticky;top:48px;font-size:12px;color:#4c545e}
table.ad tr:hover td{background:#fafbfc}
.mini{font-size:11.5px;color:var(--muted)}
.stat{display:flex;gap:18px;padding:12px 18px;font-size:13.5px}
.stat b{font-size:17px}
@media (max-width:900px){ #right{display:none} }
</style>
</head>
<body>

<!-- ════════ 로그인 ════════ -->
<div id="login">
  <h1>수행평가 주제 정하기</h1>
  <div class="sub">인공지능 기초 · 데이터 기반 머신러닝 모델 제작</div>
  <div id="gbtn"></div>
  <div id="loginmsg"></div>
  <div class="domain">학교 계정(@sdhs.gwe.hs.kr)으로 로그인하세요.</div>
</div>

<!-- ════════ 반 정보 ════════ -->
<div id="who" class="hide">
  <div class="card">
    <div class="me">
      <b id="whoName"></b> <span class="adminchip hide" id="whoAdmin">관리자</span>
      <div class="m" id="whoMail"></div>
    </div>
    <div style="font-size:13.5px;color:var(--muted);margin-bottom:9px">학년·반·번호를 입력하세요.</div>
    <div class="rowf">
      <input id="g" placeholder="학년" maxlength="1" style="max-width:74px">
      <input id="c" placeholder="반" maxlength="2" style="max-width:74px">
      <input id="n" placeholder="번호" maxlength="2" style="max-width:82px">
    </div>
    <button class="btn primary big" onclick="startChat()">시작하기</button>
    <div id="whoErr"></div>
    <div class="prev hide" id="prev"></div>
    <div style="margin-top:12px;text-align:center">
      <button class="btn sm hide" id="adminEnter" onclick="openAdmin()">관리자 화면 열기</button>
    </div>
  </div>
</div>

<!-- ════════ 본 화면 ════════ -->
<div id="app" class="hide">
  <div id="left">
    <div id="bar">
      <b>주제 정하기</b>
      <span class="u" id="ubar"></span>
      <span class="sp"></span>
      <div id="steps"></div>
      <button class="btn sm hide" id="adminBtn" onclick="openAdmin()">관리</button>
    </div>
    <div id="log"></div>
    <div id="inputbar">
      <div id="inputwrap">
        <textarea id="q" rows="1" placeholder="여기에 답을 쓰고 Enter를 누르세요  (줄바꿈은 Shift+Enter)"></textarea>
        <button class="btn primary" id="send" onclick="send()">보내기</button>
      </div>
      <div class="hint">값의 범위는 인터넷에서 직접 찾아보고 어디서 봤는지 알려 주세요. 기계학습 방법이나 파이썬 코드는 알려주지 않습니다.</div>
    </div>
  </div>
  <div id="right">
    <h3>지금까지 정해진 것</h3>
    <div class="note">대화를 하면서 채워집니다. 다 채워지면 아래 버튼이 열립니다.</div>
    <div id="spec"></div>
    <button class="btn primary big" id="finbtn" onclick="finish()" disabled>주제 확정하기</button>
    <div id="finmsg"></div>
  </div>
</div>

<!-- ════════ 완료 ════════ -->
<div id="done" class="hide">
  <h2>주제가 확정되었습니다</h2>
  <p id="donemsg"></p>
  <div style="margin-top:22px;display:flex;gap:8px">
    <button class="btn" onclick="again()">다시 정하기</button>
    <button class="btn hide" id="doneAdmin" onclick="openAdmin()">관리자 화면</button>
  </div>
</div>

<!-- ════════ 관리자 ════════ -->
<div id="admin" class="hide">
  <div id="adtop">
    <b>관리자</b><span class="u" id="adwho"></span>
    <span class="sp"></span>
    <a id="adsheet" class="btn sm" target="_blank" rel="noopener">시트 열기</a>
    <button class="btn sm" onclick="loadAdmin()">새로고침</button>
    <button class="btn sm" onclick="closeAdmin()">닫기</button>
  </div>
  <div class="stat" id="adstat"></div>
  <div id="adbody"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════
   설정 — 배포한 뒤 API_URL 만 채우면 된다
   ══════════════════════════════════════════════════════ */
const CLIENT_ID = '508397953247-cec1cb0u7jmheuup6llmo05423lcibbu.apps.googleusercontent.com';
const API_URL   = 'https://script.google.com/macros/s/AKfycbwLlLefL8g-DTDgX9ab3qUzIGCU6-zzbI0W9CyME-qsi5yNj3EJIYf-t_ZNOw9kYzAK/exec';
const DOMAIN    = 'sdhs.gwe.hs.kr';

/* ══════════════════════════════════════════════════════ */
const 단계목록 = ['주제탐색','유형정하기','타깃확정','특성확정','방향확정','이유작성','요약확인','완료'];
const 단계이름 = {주제탐색:'주제', 유형정하기:'유형', 타깃확정:'맞힐 값', 특성확정:'쓸 정보',
  방향확정:'영향', 이유작성:'이유', 요약확인:'확인', 완료:'완료'};
const KEY = 'aitopic_v2';

let 토큰 = '', 나 = null, 반정보 = null;
let 히스토리 = [], 정리 = null, 확정가능 = false, 보내는중 = false;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ── 서버 호출 ── */
async function api(body){
  if(API_URL.indexOf('PASTE_') === 0)
    return {오류:'API 주소가 설정되지 않았습니다. index.html 의 API_URL 을 채우세요.'};
  let r;
  try{
    r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   // preflight 를 피하려고 text/plain
      body: JSON.stringify(Object.assign({token: 토큰}, body))
    });
  }catch(e){ return {오류:'서버에 연결하지 못했습니다. 인터넷 상태를 확인하세요.'}; }
  let j;
  try{ j = await r.json(); }
  catch(e){ return {오류:'서버 응답을 읽지 못했습니다. 잠시 뒤 다시 시도하세요.'}; }
  if(j && j.만료){ 만료처리(); return {오류:'로그인이 만료되었습니다. 다시 로그인해 주세요.'}; }
  return j;
}
function 만료처리(){
  토큰 = ''; sessionStorage.removeItem('idt');
  document.getElementById('login').classList.remove('hide');
  document.getElementById('loginmsg').textContent = '로그인이 만료되었습니다. 다시 로그인해 주세요.';
}

/* ── 구글 로그인 ── */
window.onload = () => {
  const 대기 = setInterval(() => {
    if(!(window.google && google.accounts && google.accounts.id)) return;
    clearInterval(대기);
    google.accounts.id.initialize({
      client_id: CLIENT_ID,
      callback: onCredential,
      hd: DOMAIN,
      auto_select: true,
      cancel_on_tap_outside: false
    });
    google.accounts.id.renderButton(document.getElementById('gbtn'),
      { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'ko' });
    google.accounts.id.prompt();
  }, 120);
};
async function onCredential(res){
  토큰 = res.credential;
  sessionStorage.setItem('idt', 토큰);
  document.getElementById('loginmsg').textContent = '확인하는 중…';
  const r = await api({action:'login'});
  if(r.오류 || !r.ok){
    document.getElementById('loginmsg').textContent = r.오류 || '로그인에 실패했습니다.';
    토큰 = ''; sessionStorage.removeItem('idt');
    try{ google.accounts.id.disableAutoSelect(); }catch(e){}
    return;
  }
  나 = r;
  document.getElementById('login').classList.add('hide');
  document.getElementById('loginmsg').textContent = '';
  openWho();
}

/* ── 반 정보 ── */
function openWho(){
  document.getElementById('who').classList.remove('hide');
  document.getElementById('whoName').textContent = 나.이름 || 나.학번;
  document.getElementById('whoMail').textContent = 나.메일;
  if(나.관리자){
    document.getElementById('whoAdmin').classList.remove('hide');
    document.getElementById('adminEnter').classList.remove('hide');
  }
  if(나.이전확정 && 나.이전확정.있음){
    const p = document.getElementById('prev');
    p.classList.remove('hide');
    p.textContent = '이미 확정한 주제가 있습니다 — ' + (나.이전확정.주제 || '') +
                    '\n다시 정하면 이전 것은 지워지고 새 내용으로 바뀝니다.';
  }
  const saved = load();
  if(saved && saved.메일 === 나.메일 && saved.반정보){
    document.getElementById('g').value = saved.반정보.학년 || '';
    document.getElementById('c').value = saved.반정보.반 || '';
    document.getElementById('n').value = saved.반정보.번호 || '';
  }
}
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(
    {메일:나.메일, 반정보, 히스토리, 정리, 확정가능})); }catch(e){}
}

function startChat(){
  const v = id => document.getElementById(id).value.trim();
  if(!v('g') || !v('c') || !v('n')){
    document.getElementById('whoErr').textContent = '학년·반·번호를 모두 입력하세요.'; return;
  }
  반정보 = {학년:v('g'), 반:v('c'), 번호:v('n'), 이름:나.이름};
  const saved = load();
  const 이어감 = saved && saved.메일 === 나.메일 && (saved.히스토리||[]).length > 0;
  if(이어감){ 히스토리 = saved.히스토리; 정리 = saved.정리; 확정가능 = !!saved.확정가능; }
  else { 히스토리 = []; 정리 = null; 확정가능 = false; }
  save();
  document.getElementById('who').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('ubar').textContent =
    반정보.학년+'학년 '+반정보.반+'반 '+반정보.번호+'번 '+(나.이름||'');
  if(나.관리자) document.getElementById('adminBtn').classList.remove('hide');
  draw(); paintSpec();
  if(!이어감) 첫말();
}
function again(){
  localStorage.removeItem(KEY);
  location.reload();
}

/* ── 대화 ── */
function draw(){
  const log = document.getElementById('log');
  log.innerHTML = 히스토리.filter(m=>!m.숨김).map(m =>
    '<div class="msg '+(m.role==='user'?'me':'bot')+'">'+
      '<div class="av">'+(m.role==='user'? esc((나.이름||'나').slice(0,1)) : 'AI')+'</div>'+
      '<div class="body">'+esc(m.보일말 || m.content)+'</div></div>').join('');
  log.scrollTop = log.scrollHeight;
}
function 단계표시(cur){
  const i = 단계목록.indexOf(cur);
  document.getElementById('steps').innerHTML = 단계목록.map((s,k)=>
    '<span class="'+(k===i?'on':(k<i?'done':''))+'">'+단계이름[s]+'</span>').join('');
}
function 알림(text, bad, list){
  const log = document.getElementById('log');
  const d = document.createElement('div');
  d.className = 'sysmsg' + (bad?' bad':'');
  d.innerHTML = esc(text) + (list && list.length
    ? '<ul>'+list.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>' : '');
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
function 첫말(){
  물어보기('안녕하세요. 수행평가 주제를 정하고 싶습니다. 무엇부터 하면 될까요?', true);
}
function send(){
  const q = document.getElementById('q');
  const t = q.value.trim();
  if(!t || 보내는중) return;
  q.value=''; q.style.height='auto';
  물어보기(t, false);
}
async function 물어보기(text, 숨김){
  보내는중 = true;
  document.getElementById('send').disabled = true;
  히스토리.push({role:'user', content:text, 보일말:text, 숨김:!!숨김});
  draw();
  const log = document.getElementById('log');
  const t = document.createElement('div');
  t.className='msg bot'; t.id='typing';
  t.innerHTML = '<div class="av">AI</div><div class="body typing">생각하고 있습니다…</div>';
  log.appendChild(t); log.scrollTop = log.scrollHeight;

  const r = await api({action:'chat', history: 히스토리.map(m=>({role:m.role, content:m.content}))});
  const el = document.getElementById('typing'); if(el) el.remove();

  if(r.오류){
    히스토리.pop(); 알림(r.오류, true);
    보내는중 = false; document.getElementById('send').disabled = false;
    draw(); return;
  }
  히스토리.push({role:'assistant', content:JSON.stringify(r), 보일말:r.답변});
  정리 = r.정리; 확정가능 = !!r.확정가능;
  단계표시(r.단계);
  draw(); paintSpec(); save();
  보내는중 = false;
  document.getElementById('send').disabled = false;
  document.getElementById('q').focus();
}

/* ── 정리 패널 ── */
function paintSpec(){
  const s = 정리 || {}, t = s.타깃 || {}, f = s.특성 || [], m = s.무관변수 || {};
  const 값 = v => (v===''||v==null) ? '<span class="v no">아직</span>' : '<span class="v">'+esc(v)+'</span>';
  const 범 = (a,b,u) => (a==null||b==null||!(b>a)) ? '<span class="v no">아직</span>'
                        : '<span class="v">'+a+' ~ '+b+(u?(' '+esc(u)):'')+'</span>';
  let h = '';
  h += '<div class="sec"><h4>주제</h4><div class="in">'+
       '<div class="kv"><span class="k">유형</span>'+값(s.트랙)+'</div>'+
       '<div class="kv"><span class="k">한 줄</span>'+값(s.주제)+'</div></div></div>';
  h += '<div class="sec"><h4>맞히려는 것</h4><div class="in">';
  if(s.트랙 === '분류'){
    h += '<div class="kv"><span class="k">이름</span>'+값(t.이름)+'</div>'+
         '<div class="kv"><span class="k">두 가지</span>'+
         ((s.범주A && s.범주B)? '<span class="v">'+esc(s.범주A)+' / '+esc(s.범주B)+'</span>'
                              : '<span class="v no">아직</span>')+'</div>';
  } else {
    h += '<div class="kv"><span class="k">이름</span>'+값(t.이름)+'</div>'+
         '<div class="kv"><span class="k">단위</span>'+값(t.단위)+'</div>'+
         '<div class="kv"><span class="k">범위</span>'+범(t.최소,t.최대,t.단위)+'</div>'+
         '<div class="kv"><span class="k">근거</span>'+값(t.근거)+'</div>';
  }
  h += '</div></div>';
  h += '<div class="sec"><h4>쓸 정보 '+(f.length? '('+f.length+'개)':'')+'</h4><div class="in">';
  if(!f.length) h += '<div class="kv"><span class="v no">아직 없습니다</span></div>';
  f.forEach(x=>{
    let 방향 = '';
    if(x.영향) 방향 = '<span class="tag '+(/음$/.test(x.영향)?'down':'up')+'">'+esc(x.영향)+'</span>';
    else if(x.높은쪽) 방향 = '<span class="tag up">'+esc(x.높은쪽)+'(이) 큼</span>';
    h += '<div class="feat"><div class="nm">'+esc(x.이름||'이름 미정')+'</div>'+
         '<div class="dt">'+(x.단위? esc(x.단위)+' · ':'')+
         ((x.최대>x.최소)? (x.최소+' ~ '+x.최대) : '범위 미정')+'</div>'+
         '<div class="dt">근거 : '+(x.근거? esc(x.근거) : '<span style="color:#b9bec4">아직</span>')+'</div>'+
         방향+'</div>';
  });
  h += '</div></div>';
  if(s.트랙 !== '분류'){
    h += '<div class="sec"><h4>도움 안 될 것 같은 값</h4><div class="in">'+
         '<div class="kv"><span class="k">이름</span>'+값(m.이름)+'</div>'+
         (m.이름? '<div class="kv"><span class="k">범위</span>'+범(m.최소,m.최대,m.단위)+'</div>':'')+
         '</div></div>';
  }
  h += '<div class="sec"><h4>적어 둔 글</h4><div class="in">'+
       '<div class="kv"><span class="k">고른 이유</span>'+값(s.이유)+'</div>'+
       '<div class="kv"><span class="k">기대</span>'+값(s.기대효과)+'</div></div></div>';
  document.getElementById('spec').innerHTML = h;
  document.getElementById('finbtn').disabled = !확정가능;
  document.getElementById('finmsg').textContent = 확정가능
    ? '확정하면 선생님께 전달됩니다.' : '아직 정해지지 않은 것이 남아 있습니다.';
}

/* ── 확정 ── */
async function finish(){
  const b = document.getElementById('finbtn');
  b.disabled = true; b.textContent = '보내는 중…';
  const r = await api({action:'finalize', 정리, 반정보,
                       history: 히스토리.map(m=>({role:m.role, content:m.content}))});
  b.textContent = '주제 확정하기';
  if(r.오류){ b.disabled = false; 알림(r.오류, true); return; }
  if(r.통과){
    document.getElementById('donemsg').textContent =
      (정리.주제||'') + '\n\n선생님이 이 주제에 맞는 데이터를 만들어 나눠 줄 것입니다.';
    if(나.관리자) document.getElementById('doneAdmin').classList.remove('hide');
    document.getElementById('done').classList.remove('hide');
    return;
  }
  b.disabled = false;
  알림('아직 정해지지 않은 것이 있어 확정할 수 없습니다. 아래 내용을 대화로 더 정해 주세요.',
       true, r.부족);
}

/* ── 관리자 ── */
function openAdmin(){
  document.getElementById('admin').classList.remove('hide');
  document.getElementById('adwho').textContent = 나.메일;
  loadAdmin();
}
function closeAdmin(){ document.getElementById('admin').classList.add('hide'); }
async function loadAdmin(){
  document.getElementById('adbody').innerHTML =
    '<div style="padding:24px;color:var(--muted)">불러오는 중…</div>';
  const r = await api({action:'admin', 일:'목록'});
  if(r.오류){ document.getElementById('adbody').innerHTML =
    '<div style="padding:24px;color:var(--bad)">'+esc(r.오류)+'</div>'; return; }
  document.getElementById('adsheet').href = r.시트주소 || '#';
  const 행 = r.행 || [];
  const 예측 = 행.filter(x=>x.트랙==='예측').length;
  document.getElementById('adstat').innerHTML =
    '<div>확정 <b>'+행.length+'</b>명</div>'+
    '<div>예측 <b>'+예측+'</b></div>'+
    '<div>분류 <b>'+(행.length-예측)+'</b></div>';
  if(!행.length){ document.getElementById('adbody').innerHTML =
    '<div style="padding:24px;color:var(--muted)">확정된 주제가 아직 없습니다.</div>'; return; }
  document.getElementById('adbody').innerHTML =
    '<table class="ad"><thead><tr>'+
    '<th style="width:110px">학생</th><th style="width:60px">유형</th><th>주제</th>'+
    '<th style="width:190px">맞히려는 것</th><th>쓸 정보</th><th style="width:70px"></th>'+
    '</tr></thead><tbody>'+
    행.map(x=>{
      const 특 = (x.특성||[]).map(f=>
        esc(f.이름)+' <span class="mini">'+esc(f.단위||'')+' '+f.최소+'~'+f.최대+
        (f.영향? ' · '+esc(f.영향) : (f.높은쪽? ' · '+esc(f.높은쪽)+'↑' : ''))+
        (f.근거? '<br>└ '+esc(f.근거) : '')+'</span>').join('<br>');
      const 타 = x.트랙==='분류'
        ? esc(x.타깃.이름||'')+' <span class="mini">'+esc(x.범주A)+' / '+esc(x.범주B)+'</span>'
        : esc(x.타깃.이름||'')+' <span class="mini">'+esc(x.타깃.단위||'')+' '+
          x.타깃.최소+'~'+x.타깃.최대+(x.타깃.근거? '<br>└ '+esc(x.타깃.근거) : '')+'</span>';
      return '<tr><td>'+esc(x.학년)+'-'+esc(x.반)+'-'+esc(x.번호)+' '+esc(x.이름)+
             '<div class="mini">'+esc(x.학번)+'</div></td>'+
             '<td>'+esc(x.트랙)+'</td><td>'+esc(x.주제)+'</td>'+
             '<td>'+타+'</td><td>'+특+'</td>'+
             '<td><button class="btn sm" onclick="delOne(\''+esc(x.메일)+'\')">삭제</button></td></tr>';
    }).join('')+'</tbody></table>';
}
async function delOne(메일){
  if(!confirm(메일+' 의 확정 내용을 지울까요?')) return;
  const r = await api({action:'admin', 일:'삭제', 메일});
  if(r.오류){ alert(r.오류); return; }
  loadAdmin();
}

/* ── 입력창 ── */
const q = document.getElementById('q');
q.addEventListener('input', ()=>{ q.style.height='auto'; q.style.height=Math.min(140,q.scrollHeight)+'px'; });
q.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !document.getElementById('who').classList.contains('hide')) startChat();
});
</script>
</body>
